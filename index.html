<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=vpn_key" />

    
    <link rel="stylesheet" href="styles/all.css" media="all">
    <link rel="stylesheet" href="styles/table.css" media="screen and (min-width: 769px) and (max-width: 1024px)">
    <link rel="stylesheet" href="styles/desktop.css" media="screen and (min-width: 1025px)">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p id="texto">Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="get">
                    <div class="resp">
                        
                        <p class="pezao">
                            <label for="iemail"><span id="mail" class="material-symbols-outlined"> mail </span></label>
                            <input type="email"  name="email" id="iemail" placeholder="seu e-mail" required min length="8" max length="12" autocomplete="email"></p>
                    </div>

                    <div class="resp">
                        <p class="pezao" ><label for="isenha"><span id="chave"  class="material-symbols-outlined"> vpn_key</span></label> 
                    <input type="password"  name="senha" id="isenha" placeholder="sua senha" required min length="8" max length="12" autocomplete="current-password"></p>
                    </div>

                    <input type="submit" id="box" class="resp" value="Entrar">               

                    <p id="senha" ><a href="#" id="esq">Esqueci a senha ✉</a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
