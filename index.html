<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="get">
                    <div class="resp">
                        <p class="box" ><label for="iemail">Email:</label> <input type="email"  name="email" id="iemail" placeholder="seu e-mail"></p>
                    </div>

                    <div class="resp">
                        <p class="box" ><label for="isenha">Senha:</label> <input type="password"  name="senha" id="isenha" placeholder="sua senha"></p>
                    </div>

                    <p class="box" ><input type="submit" class="resp" value="Entrar"></p>
                    <p></p>

                    <p class="box" ><a href="#">Esqueci a senha</a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
