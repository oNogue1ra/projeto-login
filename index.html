<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                Foto
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="get">
                    <p><label for="iemail">Email:</label> <input type="email" name="email" id="iemail" placeholder="seu e-mail"></p>

                    <p><label for="isenha">Senha:</label> <input type="password" name="senha" id="isenha" placeholder="sua senha"></p>

                    <p><input type="submit" value="Entrar"></p>
                    <p></p>

                    <p><a href="#">Esqueci a senha</a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
